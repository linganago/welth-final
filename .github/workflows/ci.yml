name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── 1. Unit Tests ──────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/welth_test"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/welth_test"

      - name: Run unit tests
        run: npm test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/welth_test"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/welth_test"
          GEMINI_API_KEY: "test-key"
          ARCJET_KEY: "test-key"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          CLERK_SECRET_KEY: "sk_test_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          RESEND_API_KEY: "test-key"
          INNGEST_EVENT_KEY: "test-key"
          INNGEST_SIGNING_KEY: "test-key"
          NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "test-key"
          SENTRY_DSN: ""

  # ─── 2. Integration Tests ───────────────────────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: welth_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/welth_test"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/welth_test"

      - name: Apply migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/welth_test"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/welth_test"

      - name: Run integration tests
        run: npx vitest run --config vitest.integration.config.js
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/welth_test"
          DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/welth_test"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/welth_test"
          GEMINI_API_KEY: "test-key"
          ARCJET_KEY: "test-key"
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "pk_test_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          CLERK_SECRET_KEY: "sk_test_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
          RESEND_API_KEY: "test-key"
          INNGEST_EVENT_KEY: "test-key"
          INNGEST_SIGNING_KEY: "test-key"
          NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "test-key"
          SENTRY_DSN: ""

  # ─── 3. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_CI_BUILD: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
          GEMINI_API_KEY: "build-placeholder"
          RESEND_API_KEY: "build-placeholder"
          ARCJET_KEY: "build-placeholder"
          INNGEST_EVENT_KEY: "build-placeholder"
          INNGEST_SIGNING_KEY: "build-placeholder"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: "build-placeholder"
          SENTRY_DSN: ""
          SENTRY_ORG: ""
          SENTRY_PROJECT: ""

  # ─── 4. E2E Tests ───────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E Tests (Auth Flow)
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Check required secrets are set
        run: |
          if [ -z "$CLERK_PK" ]; then
            echo "ERROR: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY secret is not set."
            echo "Go to: GitHub repo → Settings → Secrets → Actions → New secret"
            echo "Add: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY = your pk_test_... value from Clerk dashboard"
            exit 1
          fi
          if [ -z "$CLERK_SK" ]; then
            echo "ERROR: CLERK_SECRET_KEY secret is not set."
            exit 1
          fi
          if [ -z "$DB_URL" ]; then
            echo "ERROR: DATABASE_URL secret is not set."
            exit 1
          fi
          echo "All required secrets are present."
        env:
          CLERK_PK: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SK: ${{ secrets.CLERK_SECRET_KEY }}
          DB_URL: ${{ secrets.DATABASE_URL }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Run E2E auth tests
        run: npx playwright test e2e/auth.spec.js --reporter=list
        env:
          ARCJET_ENV: "ci"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: "/sign-in"
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: "/sign-up"
          GEMINI_API_KEY: "test-key"
          RESEND_API_KEY: "test-key"
          ARCJET_KEY: "test-key"
          INNGEST_EVENT_KEY: "test-key"
          INNGEST_SIGNING_KEY: "test-key"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: "test-key"
          SENTRY_DSN: ""
          PLAYWRIGHT_BASE_URL: "http://localhost:3000"

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7